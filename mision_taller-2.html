<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión Taller · Documentación de fabricación</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#182536;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:22px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #18253618}h1{margin:0 0 8px;font-size:2rem}h2{margin:12px 0}p{line-height:1.55}.muted{color:#566577}.bar{height:10px;background:#e4eaf0;border-radius:10px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#24648a;width:0%;transition:width .25s}.options{display:grid;gap:10px;margin:22px 0}.option{padding:16px;text-align:left;border:2px solid #d7e0e8;border-radius:12px;background:white;cursor:pointer;font:inherit}.option:hover{background:#edf5fa}.option.selected{border-color:#24648a;background:#eaf4fa}.option.correct{border-color:#248251;background:#e7f7ee}.option.wrong{border-color:#b63d3d;background:#fff0f0}button{cursor:pointer;font:inherit}.primary{background:#175b84;color:white;border:0;border-radius:11px;padding:13px 22px;font-weight:700}.primary:disabled{opacity:.4;cursor:default}.secondary{background:white;color:#175b84;border:1px solid #b4c8d6;border-radius:11px;padding:11px 16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.feedback{background:#f1f5f8;border-left:4px solid #24648a;padding:15px;border-radius:8px;margin:15px 0}.hidden{display:none}.badge{display:inline-block;border-radius:100px;padding:5px 11px;background:#e4eef5;font-size:.85rem}.score{font-weight:800;color:#175b84}.footer{margin-top:20px}.switch{display:flex;gap:8px;align-items:center;margin:14px 0}.review{padding:12px 0;border-bottom:1px solid #dce3e8}.small{font-size:.9rem}@media print{.controls,.switch,.bar{display:none}.panel{box-shadow:none}.wrap{max-width:none}}</style></head><body><main class="wrap"><div class="panel"><div class="row"><span class="badge">GS Construcciones Metálicas · Módulo 0247</span><span id="points" class="score">0 puntos</span></div><h1>🏭 Misión Taller</h1><p class="muted">Documentación del proceso de fabricación · 6 misiones · 18 decisiones</p><div class="switch"><label><input type="checkbox" id="teacher"> Modo profesora (mostrar soluciones y explicaciones)</label></div><div class="bar"><div class="fill" id="fill"></div></div><section id="screen"></section><div class="row footer controls"><button class="secondary" id="restart">Reiniciar partida</button><span id="counter" class="muted small"></span></div></div></main><script>
const levels=[
{title:'El pedido misterioso',subtitle:'Identifica qué documento necesitas',qs:[
['El cliente pide 20 virolas para una fecha determinada. ¿Qué documento identifica el trabajo concreto que se va a ejecutar?',['Hoja de ruta','Orden de fabricación','WPS'],1,'La orden de fabricación identifica el producto, la cantidad y el trabajo concreto.'],
['El operario pregunta qué diámetro, espesor y longitud debe tener la virola. ¿Dónde busca esa información?',['Plano de fabricación','Parte de producción','Certificado del soldador'],0,'El plano establece la geometría y los requisitos técnicos del producto.'],
['El almacén necesita saber qué materiales requiere el producto. ¿Qué documento consulta?',['Registro dimensional','Lista de materiales','Informe de END'],1,'La lista de materiales identifica materiales y componentes necesarios.']]},
{title:'Diseña la ruta',subtitle:'Distingue la ruta del trabajo concreto',qs:[
['¿Qué documento establece la secuencia corte → curvado → ajuste → soldadura?',['Orden de fabricación','Hoja de ruta','Certificado 3.1'],1,'La hoja de ruta define operaciones, secuencia y centros de trabajo.'],
['La empresa recibe otro pedido de 10 virolas idénticas. ¿Qué procede normalmente?',['Nueva orden, misma ruta vigente','Nueva ruta obligatoria','Nuevo certificado del soldador'],0,'La misma ruta puede utilizarse para varias órdenes si no cambian las condiciones técnicas.'],
['¿Qué documento desarrolla las condiciones técnicas de una operación de curvado?',['Albarán de entrega','Factura del material','Hoja de proceso o instrucción técnica'],2,'La hoja de proceso o instrucción concreta medios, condiciones y controles.']]},
{title:'Los documentos de taller',subtitle:'Cada documento tiene su función',qs:[
['Antes de soldar, ¿qué documento especifica las variables del procedimiento de soldeo?',['WPS','WPQR','Orden de fabricación'],0,'La WPS especifica cómo ejecutar la soldadura dentro de su ámbito de aplicación.'],
['¿Qué documento contiene los resultados de la cualificación del procedimiento de soldeo?',['Plano de despiece','WPQR','Hoja de anidado'],1,'La WPQR registra la cualificación del procedimiento de soldeo.'],
['Para colocar las piezas desarrolladas sobre una chapa y aprovechar material, ¿qué se utiliza?',['Registro END','Mapa de soldaduras','Plano o ficha de anidado'],2,'El anidado organiza la distribución de piezas sobre la chapa inicial.']]},
{title:'La inspección',subtitle:'Diferencia instrucciones y evidencias',qs:[
['¿Qué documento indica qué dimensiones deben comprobarse y cómo?',['Pauta de inspección','Orden de compra','Parte de avería'],0,'La pauta indica características, métodos y criterios de inspección.'],
['Se mide un diámetro de 601 mm, siendo el requisito 600 ± 2 mm. ¿Dónde se deja constancia del resultado?',['WPS','Registro de inspección','Hoja de ruta estándar'],1,'El registro recoge el resultado; 601 mm cumple ese requisito dimensional.'],
['¿Qué documento proporciona resultados de inspección específica del material conforme a EN 10204, tipo 3.1?',['Orden de fabricación','Parte de mantenimiento','Certificado de inspección 3.1'],2,'El certificado 3.1 recoge resultados de inspección específica; la trazabilidad debe relacionarlo con la pieza.']]},
{title:'Incidencias en fábrica',subtitle:'Toma decisiones como responsable técnico',qs:[
['La curvadora se avería y existe otra máquina equivalente y validada. ¿Qué actuación es normalmente adecuada?',['Rehacer siempre toda la ruta','Reasignar el recurso y actualizar la programación','Cancelar automáticamente la orden'],1,'Si el método sigue siendo válido, puede resolverse reprogramando los recursos.'],
['Ingeniería cambia el curvado por una secuencia de plegados. ¿Qué debe revisarse?',['Ruta y documentación técnica afectada','Solo el plazo de entrega','Solo la cantidad de la OF'],0,'Cambiar el método tecnológico puede exigir revisar ruta, instrucciones y controles.'],
['Se descubre que el operario utiliza una revisión antigua del plano. ¿Qué debe hacerse?',['Continuar porque conoce el trabajo','Cambiar solo el nombre del archivo','Detener la operación afectada y verificar la documentación vigente'],2,'Hay que impedir el uso de requisitos obsoletos y evaluar lo ya realizado.']]},
{title:'Cierra el expediente',subtitle:'Demuestra que la fabricación está controlada',qs:[
['¿Qué documento demuestra el resultado de un ensayo por ultrasonidos realizado a una soldadura?',['Informe de END','Hoja de ruta','Orden de fabricación'],0,'El informe END documenta el ensayo, su alcance y resultados.'],
['¿Todas las virolas metálicas necesitan marcado CE?',['Sí, sin excepción','No; depende del producto y legislación aplicable','Solo si son de acero S355JR'],1,'El marcado CE depende de la legislación aplicable al producto y a su uso previsto.'],
['¿Qué es un expediente de fabricación?',['Únicamente la orden de fabricación','Una lista de todas las máquinas','Un conjunto organizado de documentos y evidencias del trabajo'],2,'Reúne la documentación pertinente para reconstruir y demostrar la fabricación, según los requisitos aplicables.']]}];
let stage=0,q=0,chosen=null,confirmed=false,score=0,started=false,done=false,results=[];const $=id=>document.getElementById(id);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function total(){return levels.reduce((n,l)=>n+l.qs.length,0)}function completed(){return levels.slice(0,stage).reduce((n,l)=>n+l.qs.length,0)+q}function render(){ $('points').textContent=score+' puntos';$('fill').style.width=(done?100:completed()/total()*100)+'%';$('counter').textContent=done?'Partida finalizada':started?`Pregunta ${completed()+1} de ${total()}`:'';let s=$('screen');if(!started){s.innerHTML=`<h2>El encargo</h2><p>Tu empresa debe fabricar <strong>20 virolas de acero S355JR</strong>. Identifica la documentación, organiza el trabajo y resuelve incidencias.</p><p>Seis misiones, tres decisiones por misión. Cada acierto suma 10 puntos. Tras cada respuesta se muestra una explicación técnica.</p><button class="primary" id="start">Comenzar misión →</button>`;$('start').onclick=()=>{started=true;render()};return}if(done){let rank=score>=150?'Responsable de procesos':score>=110?'Técnico de oficina técnica':'Técnico en formación';s.innerHTML=`<h2>🏆 Fabricación completada</h2><p class="score" style="font-size:2rem">${score} / ${total()*10} puntos</p><p><strong>${rank}</strong> · ${score/10} aciertos de ${total()}</p><h3>Informe por misión</h3>${levels.map((l,i)=>`<div class="review">${esc(l.title)}: <strong>${results.filter(r=>r.stage===i&&r.correct).length}/${l.qs.length}</strong></div>`).join('')}<p><button class="primary" id="again">Volver a jugar</button> <button class="secondary" id="print">Imprimir informe</button></p>`;$('again').onclick=reset;$('print').onclick=()=>window.print();return}let l=levels[stage],item=l.qs[q];s.innerHTML=`<p class="badge">Misión ${stage+1} de ${levels.length}</p><h2>${esc(l.title)}</h2><p class="muted">${esc(l.subtitle)} · Decisión ${q+1} de ${l.qs.length}</p><h3>${esc(item[0])}</h3><div class="options">${item[1].map((o,i)=>`<button class="option ${chosen===i?'selected':''} ${confirmed&&i===item[2]?'correct':''} ${confirmed&&chosen===i&&i!==item[2]?'wrong':''}" data-choice="${i}" ${confirmed?'disabled':''}>${'ABC'[i]}. ${esc(o)}</button>`).join('')}</div><div id="teacherNote" class="feedback ${$('teacher').checked&&!confirmed?'':'hidden'}"><strong>Solución para la profesora:</strong> ${'ABC'[item[2]]}. ${esc(item[1][item[2]])}<p>${esc(item[3])}</p></div>${confirmed?`<div class="feedback"><strong>${chosen===item[2]?'✓ Decisión correcta · +10 puntos':'Revisión técnica'}</strong><p>${esc(item[3])}</p></div><button class="primary" id="next">${stage===levels.length-1&&q===l.qs.length-1?'Ver resultado final':'Continuar →'}</button>`:`<button class="primary" id="confirm" ${chosen===null?'disabled':''}>Confirmar decisión</button>`}`;s.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.choice);render()});if(confirmed){$('next').onclick=()=>{if(q<l.qs.length-1)q++;else if(stage<levels.length-1){stage++;q=0}else done=true;chosen=null;confirmed=false;render()}}else{$('confirm').onclick=()=>{if(chosen===null)return;confirmed=true;let correct=chosen===item[2];if(correct)score+=10;results.push({stage,correct});render()}}}function reset(){stage=0;q=0;chosen=null;confirmed=false;score=0;started=false;done=false;results=[];render()}$('restart').onclick=()=>{if(confirm('¿Reiniciar la partida y borrar los puntos de esta sesión?'))reset()};$('teacher').onchange=render;render();
</script></body></html>
